<svg xmlns="http://www.w3.org/2000/svg" id="C6" width="520" height="745" viewBox="0 0 520 745" role="img" aria-labelledby="C6-title C6-desc">
<title id="C6-title">运行时把这些能力组织起来</title><desc id="C6-desc">运行时装配上下文，调用模型，执行工具并更新任务状态。工具访问外部文档与服务，环境结果先返回执行器，再由程序更新任务状态。运行时也控制继续、等待与停止。</desc>
<defs>
<marker id="C6-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker>
<marker id="C6-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#346DB7"/></marker>
<marker id="C6-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker>
<marker id="C6-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#546C80"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#20344B}.title{font-size:26px;font-weight:700}.label{font-size:24px;font-weight:650}.body{font-size:20px}.small{font-size:18px;fill:#546C80}.micro{font-size:16px;fill:#546C80}</style>
<rect width="520" height="745" rx="18" fill="#F6F9FC"/>
<text x="24" y="43" class="title" text-anchor="start">运行时把这些能力组织起来</text>
<text x="24" y="76" class="small" text-anchor="start">能力说明“能做什么”，运行时组织“怎样做”</text>
<rect x="24" y="104" width="472" height="368" rx="18" fill="#EEF5FA" stroke="#9AB8CD" stroke-width="1.5"/>
<text x="44" y="137" class="label" text-anchor="start" style="fill:#087F86">运行时 / 应用程序</text>
<rect x="49" y="171" width="195" height="75" rx="12" fill="white" stroke="#C8D7E4" stroke-width="1.5"/>
<text x="146" y="216" class="label" text-anchor="middle">本轮上下文</text>
<rect x="291" y="171" width="180" height="75" rx="12" fill="#EAF1FD" stroke="#346DB7" stroke-width="1.5"/>
<text x="381" y="216" class="label" text-anchor="middle" style="fill:#346DB7">模型</text>
<rect x="49" y="354" width="195" height="75" rx="12" fill="white" stroke="#087F86" stroke-width="1.5"/>
<text x="146" y="399" class="label" text-anchor="middle" style="fill:#087F86">任务状态</text>
<rect x="291" y="354" width="180" height="75" rx="12" fill="white" stroke="#B56B26" stroke-width="1.5"/>
<text x="381" y="399" class="label" text-anchor="middle" style="fill:#B56B26">执行器</text>
<path d="M244 208 H291" fill="none" stroke="#346DB7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#C6-blue)"/>
<path d="M381 246 V354" fill="none" stroke="#B56B26" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#C6-orange)"/>
<text x="392" y="301" class="small" text-anchor="start" style="fill:#B56B26">动作请求</text>
<path d="M291 391 H244" fill="none" stroke="#087F86" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#C6-arrow)"/>
<path d="M146 354 V246" fill="none" stroke="#087F86" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#C6-arrow)"/>
<text x="134" y="299" class="small" text-anchor="end" style="fill:#087F86">选入</text>
<circle cx="260" cy="301" r="41" fill="#DBE9F2" stroke="none" stroke-width="1.5"/>
<text x="260" y="296" class="body" text-anchor="middle">组织</text>
<text x="260" y="322" class="body" text-anchor="middle">循环</text>
<path d="M381 429 V575" fill="none" stroke="#B56B26" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#C6-orange)"/>
<text x="369" y="527" class="small" text-anchor="end" style="fill:#B56B26">调用</text>
<path d="M441 575 V429" fill="none" stroke="#087F86" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#C6-arrow)"/>
<text x="451" y="512" class="small" text-anchor="start" style="fill:#087F86">返回</text>
<text x="451" y="537" class="small" text-anchor="start" style="fill:#087F86">观察</text>
<rect x="24" y="575" width="472" height="125" rx="18" fill="white" stroke="#9AB8CD" stroke-width="1.5"/>
<text x="44" y="613" class="label" text-anchor="start">环境</text>
<rect x="47" y="632" width="202" height="45" rx="8" fill="#E8F5F3" stroke="#087F86" stroke-width="1.5"/>
<text x="148" y="662" class="body" text-anchor="middle" style="fill:#087F86">制度资料库</text>
<rect x="271" y="632" width="202" height="45" rx="8" fill="#FFF9F2" stroke="#E7C7A7" stroke-width="1.5"/>
<text x="372" y="662" class="body" text-anchor="middle" style="fill:#B56B26">工单等外部服务</text>
<text x="260" y="731" class="small" text-anchor="middle">同一运行时还会处理继续、等待与停止</text>
</svg>
