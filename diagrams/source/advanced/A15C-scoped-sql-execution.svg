<svg xmlns="http://www.w3.org/2000/svg" id="A15C" viewBox="0 0 1400 1000" role="img" aria-labelledby="A15C-title A15C-desc">
<title id="A15C-title">SQL 执行：先限定数据，再限定动作</title>
<desc id="A15C-desc">可信宿主按身份从只读源库复制允许行到独立SQLite快照，候选SQL还需通过表列函数操作校验及步数时间行数预算；去掉WHERE也不能读取快照之外的数据。</desc>
<defs>
<marker id="A15C-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker>
<marker id="A15C-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker>
<marker id="A15C-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657987"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#253746}.title{font-size:39px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:23px}.note{font-size:22px;fill:#536D79}.arrow-label{font-size:19px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1400" height="1000" fill="#fff"/>
<text x="50" y="80" class="title">SQL 执行：先限定数据，再限定动作</text>
<path d="M 233.33333333333334 290 H 273.33333333333337" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A15C-teal)"/>
<path d="M 456.66666666666674 290 H 496.6666666666667" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A15C-teal)"/>
<path d="M 680.0 290 H 720.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A15C-teal)"/>
<path d="M 903.3333333333334 290 H 943.3333333333334" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A15C-teal)"/>
<path d="M 1126.6666666666667 290 H 1166.6666666666667" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A15C-teal)"/>
<path d="M 811.6666666666666 340 L 205.0 540" fill="none" stroke="#B56B26" stroke-width="3" marker-end="url(#A15C-orange)"/>
<text x="508.3333333333333" y="432.0" text-anchor="middle" class="arrow-label">否 / 异常</text>
<path d="M 1035.0 340 L 555.0 540" fill="none" stroke="#B56B26" stroke-width="3" marker-end="url(#A15C-orange)"/>
<text x="795.0" y="432.0" text-anchor="middle" class="arrow-label">否 / 异常</text>
<rect x="50.0" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="141.66666666666669" y="298" text-anchor="middle" class="body">可信身份</text>
<rect x="273.33333333333337" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="365.00000000000006" y="298" text-anchor="middle" class="body">宿主筛选允许行</text>
<rect x="496.6666666666667" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="588.3333333333334" y="298" text-anchor="middle" class="body">独立SQLite快照</text>
<rect x="720.0" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="811.6666666666666" y="298" text-anchor="middle" class="body">表列函数操作校验</text>
<rect x="943.3333333333334" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1035.0" y="298" text-anchor="middle" class="body">步数时间行数预算</text>
<rect x="1166.6666666666667" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1258.3333333333335" y="298" text-anchor="middle" class="body">返回结果</text>
<rect x="50" y="540" width="310" height="100" rx="12" fill="#FFF6EC" stroke="#B56B26" stroke-width="2"/>
<text x="205.0" y="598" text-anchor="middle" class="body">未授权：拒绝</text>
<rect x="400" y="540" width="310" height="100" rx="12" fill="#FFF6EC" stroke="#B56B26" stroke-width="2"/>
<text x="555.0" y="598" text-anchor="middle" class="body">超限：停止</text>
<rect x="50" y="780" width="500" height="100" rx="12" fill="#F2F5F8" stroke="#657987" stroke-width="2"/>
<text x="300.0" y="824" text-anchor="middle" class="body">只读源库</text>
<text x="300.0" y="852" text-anchor="middle" class="body">仅宿主可读取</text>
<rect x="590" y="780" width="500" height="100" rx="12" fill="#F2F5F8" stroke="#657987" stroke-width="2"/>
<text x="840.0" y="824" text-anchor="middle" class="body">候选SQL</text>
<text x="840.0" y="852" text-anchor="middle" class="body">仅对独立快照执行</text>
<text x="50" y="955" class="note">源库薪资不复制；去掉WHERE也只能读取当前快照；这不是OS沙箱</text>
</svg>
