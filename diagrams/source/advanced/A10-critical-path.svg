<svg xmlns="http://www.w3.org/2000/svg" id="A10" width="760" height="825" viewBox="0 0 760 825" role="img" aria-labelledby="A10-title A10-desc">
<title id="A10-title">关键路径：快在依赖安排，不只快在模型</title>
<desc id="A10-desc">规划耗时200毫秒，独立读取A耗时300毫秒、读取B耗时500毫秒，两路结束后综合耗时400毫秒。理想并行下关键路径为规划、读取B和综合，共1100毫秒；串行为1400毫秒。忽略排队等开销，若B依赖A的输出则不可并行。</desc>
<defs><marker id="A10-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker><marker id="A10-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
<rect x="1" y="1" width="758" height="823" rx="20" fill="#F8FBFC" stroke="#D6E5EA" stroke-width="2"/>
<text x="30" y="50" font-size="30" font-weight="700" text-anchor="start" fill="#253746">关键路径：快在依赖安排，不只快在模型</text>

<text x="30" y="89" font-size="22" font-weight="400" text-anchor="start" fill="#546C80">规划之后，两路读取互不等待；综合等待两路完成</text>
<path d="M180.0 145 L180.0 459" fill="none" stroke="#D6E5EA" stroke-width="2" stroke-dasharray="6 6"/><text x="180.0" y="130" font-size="20" font-weight="400" text-anchor="middle" fill="#546C80">0</text>
<path d="M264.0 145 L264.0 459" fill="none" stroke="#D6E5EA" stroke-width="2" stroke-dasharray="6 6"/><text x="264.0" y="130" font-size="20" font-weight="400" text-anchor="middle" fill="#546C80">200</text>
<path d="M390.0 145 L390.0 459" fill="none" stroke="#D6E5EA" stroke-width="2" stroke-dasharray="6 6"/><text x="390.0" y="130" font-size="20" font-weight="400" text-anchor="middle" fill="#546C80">500</text>
<path d="M474.0 145 L474.0 459" fill="none" stroke="#D6E5EA" stroke-width="2" stroke-dasharray="6 6"/><text x="474.0" y="130" font-size="20" font-weight="400" text-anchor="middle" fill="#546C80">700</text>
<path d="M642.0 145 L642.0 459" fill="none" stroke="#D6E5EA" stroke-width="2" stroke-dasharray="6 6"/><text x="642.0" y="130" font-size="20" font-weight="400" text-anchor="middle" fill="#546C80">1100</text>
<text x="700" y="130" font-size="20" font-weight="400" text-anchor="start" fill="#546C80">ms</text>
<text x="30" y="204" font-size="24" font-weight="650" text-anchor="start" fill="#253746">规划</text>
<rect x="180.0" y="170" width="84.0" height="52" rx="7" fill="#087F86" stroke="#087F86" stroke-width="2"/><text x="222.0" y="205" font-size="22" font-weight="650" text-anchor="middle" fill="white">200</text>
<text x="30" y="284" font-size="24" font-weight="650" text-anchor="start" fill="#253746">读取 A</text>
<rect x="264.0" y="250" width="126.0" height="52" rx="7" fill="#8ABDBF" stroke="#8ABDBF" stroke-width="2"/><text x="327.0" y="285" font-size="22" font-weight="650" text-anchor="middle" fill="#253746">300</text>
<text x="30" y="364" font-size="24" font-weight="650" text-anchor="start" fill="#253746">读取 B</text>
<rect x="264.0" y="330" width="210.0" height="52" rx="7" fill="#087F86" stroke="#087F86" stroke-width="2"/><text x="369.0" y="365" font-size="22" font-weight="650" text-anchor="middle" fill="white">500</text>
<text x="30" y="444" font-size="24" font-weight="650" text-anchor="start" fill="#253746">综合</text>
<rect x="474.0" y="410" width="168.0" height="52" rx="7" fill="#087F86" stroke="#087F86" stroke-width="2"/><text x="558.0" y="445" font-size="22" font-weight="650" text-anchor="middle" fill="white">400</text>
<path d="M390 276 L474 276" fill="none" stroke="#546C80" stroke-width="2" stroke-dasharray="6 6"/><text x="432" y="313" font-size="20" font-weight="400" text-anchor="middle" fill="#546C80">等待</text>
<text x="30" y="503" font-size="25" font-weight="650" text-anchor="start" fill="#087F86">关键路径</text>
<text x="30" y="538" font-size="24" font-weight="400" text-anchor="start" fill="#253746">规划 → 较慢的读取 B → 综合</text>
<rect x="30" y="575" width="700" height="100" rx="14" fill="#E8F5F3" stroke="#087F86" stroke-width="2"/><text x="380" y="613" font-size="23" font-weight="650" text-anchor="middle" fill="#087F86">理想并行：200 + max(300, 500) + 400</text>
<text x="380" y="650" font-size="28" font-weight="700" text-anchor="middle" fill="#087F86">= 1100 ms</text>
<text x="30" y="720" font-size="23" font-weight="400" text-anchor="start" fill="#253746">串行：200 + 300 + 500 + 400 = 1400 ms</text>
<text x="30" y="762" font-size="22" font-weight="400" text-anchor="start" fill="#546C80">教学固定耗时；未计排队、限流和重试。</text>
<text x="30" y="796" font-size="22" font-weight="400" text-anchor="start" fill="#546C80">若读取 B 需要 A 的结果，就不能这样并行。</text>

</svg>
