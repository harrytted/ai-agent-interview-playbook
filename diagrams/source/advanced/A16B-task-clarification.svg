<svg xmlns="http://www.w3.org/2000/svg" id="A16B" viewBox="0 0 1400 1000" role="img" aria-labelledby="A16B-title A16B-desc">
<title id="A16B-title">缺少日期时，同一任务怎样继续</title>
<desc id="A16B-desc">可靠接收后返回202和任务ID，Worker缺日期时持久等待；收到日期回复后沿原任务重新排队、读取制度并回答，任务ID和累计预算不重置。</desc>
<defs>
<marker id="A16B-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker>
<marker id="A16B-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker>
<marker id="A16B-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657987"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#253746}.title{font-size:39px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:23px}.note{font-size:22px;fill:#536D79}.arrow-label{font-size:19px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1400" height="1000" fill="#fff"/>
<text x="50" y="80" class="title">缺少日期时，同一任务怎样继续</text>
<path d="M 278.0 290 H 318.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A16B-teal)"/>
<path d="M 546.0 290 H 586.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A16B-teal)"/>
<path d="M 814.0 290 H 854.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A16B-teal)"/>
<path d="M 1082.0 290 H 1122.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A16B-teal)"/>
<path d="M 700.0 340 L 205.0 540" fill="none" stroke="#B56B26" stroke-width="3" marker-end="url(#A16B-orange)"/>
<text x="452.5" y="432.0" text-anchor="middle" class="arrow-label">否 / 异常</text>
<path d="M 205.0 640 V 730 H 432.0 V 340" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A16B-teal)"/>
<text x="318.5" y="432.0" text-anchor="middle" class="arrow-label">收到日期回复，沿用原任务</text>
<rect x="50.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="164.0" y="284" text-anchor="middle" class="body">可靠接收</text>
<text x="164.0" y="312" text-anchor="middle" class="body">202 + 任务ID</text>
<rect x="318.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="432.0" y="298" text-anchor="middle" class="body">已排队</text>
<rect x="586.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="700.0" y="298" text-anchor="middle" class="body">日期齐全？</text>
<rect x="854.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="968.0" y="298" text-anchor="middle" class="body">读取制度</text>
<rect x="1122.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1236.0" y="298" text-anchor="middle" class="body">有证据回答</text>
<rect x="50" y="540" width="310" height="100" rx="12" fill="#FFF6EC" stroke="#B56B26" stroke-width="2"/>
<text x="205.0" y="584" text-anchor="middle" class="body">等待补日期</text>
<text x="205.0" y="612" text-anchor="middle" class="body">重启后保留</text>
<text x="50" y="955" class="note">任务ID不变；累计预算不重置；202只表示可靠接收</text>
</svg>
