<svg xmlns="http://www.w3.org/2000/svg" id="A18B" viewBox="0 0 1400 1000" role="img" aria-labelledby="A18B-title A18B-desc">
<title id="A18B-title">先留证据，再核对最终条件</title>
<desc id="A18B-desc">原始媒体先保存带图像区域或音频时间的证据，再核对最终条件；临时转写仅作候选，票据650与最终转写6500冲突或证据模糊时等待澄清，不继续形成有依据草稿。</desc>
<defs>
<marker id="A18B-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker>
<marker id="A18B-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker>
<marker id="A18B-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657987"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#253746}.title{font-size:39px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:23px}.note{font-size:22px;fill:#536D79}.arrow-label{font-size:19px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1400" height="1000" fill="#fff"/>
<text x="50" y="80" class="title">先留证据，再核对最终条件</text>
<path d="M 278.0 290 H 318.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A18B-teal)"/>
<path d="M 546.0 290 H 586.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A18B-teal)"/>
<path d="M 814.0 290 H 854.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A18B-teal)"/>
<path d="M 1082.0 290 H 1122.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A18B-teal)"/>
<path d="M 164.0 340 L 205.0 540" fill="none" stroke="#657987" stroke-width="3" marker-end="url(#A18B-gray)"/>
<text x="184.5" y="432.0" text-anchor="middle" class="arrow-label">临时转写</text>
<path d="M 968.0 340 L 555.0 540" fill="none" stroke="#B56B26" stroke-width="3" marker-end="url(#A18B-orange)"/>
<text x="761.5" y="432.0" text-anchor="middle" class="arrow-label">否</text>
<rect x="50.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="164.0" y="298" text-anchor="middle" class="body">原始媒体</text>
<rect x="318.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="432.0" y="284" text-anchor="middle" class="body">带定位的证据</text>
<text x="432.0" y="312" text-anchor="middle" class="body">区域 / 秒数</text>
<rect x="586.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="700.0" y="298" text-anchor="middle" class="body">最终条件</text>
<rect x="854.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="968.0" y="298" text-anchor="middle" class="body">金额一致且清晰？</text>
<rect x="1122.0" y="240" width="228.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1236.0" y="298" text-anchor="middle" class="body">继续查政策</text>
<rect x="50" y="540" width="310" height="100" rx="12" fill="#F2F5F8" stroke="#657987" stroke-width="2"/>
<text x="205.0" y="584" text-anchor="middle" class="body">临时转写</text>
<text x="205.0" y="612" text-anchor="middle" class="body">仅作候选</text>
<rect x="400" y="540" width="310" height="100" rx="12" fill="#FFF6EC" stroke="#B56B26" stroke-width="2"/>
<text x="555.0" y="570" text-anchor="middle" class="body">金额冲突 / 模糊</text>
<text x="555.0" y="598" text-anchor="middle" class="body">等待澄清</text>
<text x="555.0" y="626" text-anchor="middle" class="body">650 ≠ 6500</text>
<text x="50" y="955" class="note">定位合法不等于内容正确；本例使用人工夹具，未执行识别模型</text>
</svg>
