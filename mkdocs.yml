site_name: Agent 学习手册
site_description: 从基础原理到工程进阶，配合 92 道详解面试题与 Python 实验，系统学习 AI Agent。
site_url: https://harrytted.github.io/ai-agent-interview-playbook/
repo_url: https://github.com/harrytted/ai-agent-interview-playbook
repo_name: GitHub 仓库
edit_uri: ""
docs_dir: .site-src
site_dir: site
use_directory_urls: true
hooks:
  - website/hooks.py

theme:
  name: material
  language: zh
  font: false
  favicon: assets/favicon.svg
  icon:
    logo: material/book-open-page-variant-outline
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - assets/stylesheets/reading.css
extra_javascript:
  - assets/javascripts/reading.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/harrytted/ai-agent-interview-playbook
      name: GitHub 源码与反馈

