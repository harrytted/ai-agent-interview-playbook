<svg xmlns="http://www.w3.org/2000/svg" id="A17B" viewBox="0 0 1400 1000" role="img" aria-labelledby="A17B-title A17B-desc">
<title id="A17B-title">去抖：等最新版本的安静窗口</title>
<desc id="A17B-desc">v2在逻辑第0秒到达，携带变化条文的v3在第2秒替换待办，5秒窗口使到期点延至第7秒；第6秒flush仍等待，第7秒只接受v3一项任务。</desc>
<defs>
<marker id="A17B-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker>
<marker id="A17B-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker>
<marker id="A17B-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657987"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#253746}.title{font-size:39px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:23px}.note{font-size:22px;fill:#536D79}.arrow-label{font-size:19px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1400" height="1000" fill="#fff"/>
<text x="50" y="80" class="title">去抖：等最新版本的安静窗口</text>
<path d="M 345.0 290 H 385.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17B-teal)"/>
<path d="M 680.0 290 H 720.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17B-teal)"/>
<path d="M 1015.0 290 H 1055.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17B-teal)"/>
<path d="M 1202.5 340 L 205.0 540" fill="none" stroke="#657987" stroke-width="3" marker-end="url(#A17B-gray)"/>
<text x="703.75" y="432.0" text-anchor="middle" class="arrow-label">未到期</text>
<path d="M 1202.5 340 L 555.0 540" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17B-teal)"/>
<text x="878.75" y="432.0" text-anchor="middle" class="arrow-label">到期</text>
<rect x="50.0" y="240" width="295.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="197.5" y="298" text-anchor="middle" class="body">第0秒：v2</text>
<rect x="385.0" y="240" width="295.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="532.5" y="298" text-anchor="middle" class="body">第2秒：v3</text>
<rect x="720.0" y="240" width="295.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="867.5" y="284" text-anchor="middle" class="body">持久待办v3</text>
<text x="867.5" y="312" text-anchor="middle" class="body">第7秒到期</text>
<rect x="1055.0" y="240" width="295.0" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1202.5" y="298" text-anchor="middle" class="body">显式flush检查</text>
<rect x="50" y="540" width="310" height="100" rx="12" fill="#F2F5F8" stroke="#657987" stroke-width="2"/>
<text x="205.0" y="598" text-anchor="middle" class="body">第6秒：等待</text>
<rect x="400" y="540" width="310" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="555.0" y="584" text-anchor="middle" class="body">第7秒：接受</text>
<text x="555.0" y="612" text-anchor="middle" class="body">仅1项v3任务</text>
<text x="50" y="955" class="note">5个逻辑秒去抖窗口；持久待办不会自动成为已派发任务</text>
</svg>
