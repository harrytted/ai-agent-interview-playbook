<svg xmlns="http://www.w3.org/2000/svg" id="A14B" viewBox="0 0 1400 1000" role="img" aria-labelledby="A14B-title A14B-desc">
<title id="A14B-title">业务日期决定适用版本</title>
<desc id="A14B-desc">同为住宿650元，出差日2026-10-31匹配上限600元的v1而超标，2026-11-12匹配上限700元的v2而未超标；按业务日期选版。</desc>
<defs>
