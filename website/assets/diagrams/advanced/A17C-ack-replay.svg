<svg xmlns="http://www.w3.org/2000/svg" id="A17C" viewBox="0 0 1400 1000" role="img" aria-labelledby="A17C-title A17C-desc">
<title id="A17C-title">保存后确认丢失，重投怎样处理</title>
<desc id="A17C-desc">本地事务已保存一项任务、一次预算扣减和一条待发通知后，在输入确认前中断；重启同一数据库并重投同一事件时查账本补记确认，不重复接受任务或扣预算。</desc>
<defs>
<marker id="A17C-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087F86"/></marker>
<marker id="A17C-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#B56B26"/></marker>
<marker id="A17C-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#657987"/></marker>
</defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#253746}.title{font-size:39px;font-weight:700}.label{font-size:25px;font-weight:650}.body{font-size:23px}.note{font-size:22px;fill:#536D79}.arrow-label{font-size:19px;paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1400" height="1000" fill="#fff"/>
<text x="50" y="80" class="title">保存后确认丢失，重投怎样处理</text>
<path d="M 233.33333333333334 290 H 273.33333333333337" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17C-teal)"/>
<path d="M 456.66666666666674 290 H 496.6666666666667" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17C-teal)"/>
<path d="M 680.0 290 H 720.0" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17C-teal)"/>
<path d="M 903.3333333333334 290 H 943.3333333333334" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17C-teal)"/>
<path d="M 1126.6666666666667 290 H 1166.6666666666667" fill="none" stroke="#087F86" stroke-width="3" marker-end="url(#A17C-teal)"/>
<rect x="50.0" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="141.66666666666669" y="270" text-anchor="middle" class="body">本地事务已提交</text>
<text x="141.66666666666669" y="298" text-anchor="middle" class="body">任务1 / 预算扣1</text>
<text x="141.66666666666669" y="326" text-anchor="middle" class="body">本地待发1</text>
<rect x="273.33333333333337" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="365.00000000000006" y="298" text-anchor="middle" class="body">确认前中断</text>
<rect x="496.6666666666667" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="588.3333333333334" y="298" text-anchor="middle" class="body">重启同一数据库</text>
<rect x="720.0" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="811.6666666666666" y="298" text-anchor="middle" class="body">重投同一事件</text>
<rect x="943.3333333333334" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1035.0" y="298" text-anchor="middle" class="body">查接收账本</text>
<rect x="1166.6666666666667" y="240" width="183.33333333333334" height="100" rx="12" fill="#EAF8F7" stroke="#087F86" stroke-width="2"/>
<text x="1258.3333333333335" y="298" text-anchor="middle" class="body">补记确认</text>
<text x="50" y="955" class="note">任务仍为1；预算仅扣1；本地通知意图不表示外部已经送达</text>
</svg>
