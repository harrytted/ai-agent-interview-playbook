<svg xmlns="http://www.w3.org/2000/svg" id="G3" width="440" height="1095" viewBox="0 0 440 1095" role="img" aria-labelledby="G3-title G3-desc">
<title id="G3-title">G3 工具结果在哪一轮进入？</title>
<desc id="G3-desc">第一轮输入包含任务、当前状态和工具定义。模型或离线策略给出search_policy请求；运行时校验执行并记录ToolResult。第二轮输入保留调用与匹配call_id的结果，然后产生有证据的结构化回答。缺少日期时在第一轮澄清且零工具调用。</desc>
<defs><marker id="G3-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e84"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#162c40}.small{font-size:15px;fill:#526879}.body{font-size:17px}.label{font-size:16px;font-weight:600}.title{font-size:25px;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.line{fill:none;stroke:#087e84;stroke-width:2;marker-end:url(#G3-arrow)}.rule{stroke:#b5c5d0;stroke-width:1}</style>
<rect width="440" height="1095" rx="16" fill="#f6f8fb"/>
<rect x="20" y="22" width="44" height="28" rx="7" fill="#162c40"/><text x="42" y="42" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">G3</text>
<text x="20" y="85" class="title">工具结果在哪一轮进入？</text>
<text x="20" y="113" class="small">同一call_id连接请求与回包。</text>
<rect x="20" y="137" width="400" height="109" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="150" width="4" height="83" rx="2" fill="#2667ac"/>
<text x="37" y="165" class="label" style="fill:#2667ac">① 第1轮输入 context</text>
<text x="37" y="192" class="body">用户问题 + known + 工具定义</text>
<text x="37" y="217" class="body">目前没有取得政策证据</text>
<path class="line" d="M220 246 V273"/>
<rect x="20" y="276" width="400" height="134" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="289" width="4" height="108" rx="2" fill="#087e84"/>
<text x="37" y="304" class="label" style="fill:#087e84">② 决定 Decision.tool_calls</text>
<text x="37" y="331" class="body">search_policy(city=&quot;海岚&quot;,</text>
<text x="37" y="356" class="body">trip_date=&quot;2026-11-12&quot;, …)</text>
<text x="37" y="381" class="body">call_id = c1；output = null</text>
<path class="line" d="M220 410 V437"/>
<rect x="20" y="440" width="400" height="109" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="453" width="4" height="83" rx="2" fill="#a35d18"/>
<text x="37" y="468" class="label" style="fill:#a35d18">③ 宿主校验，再执行工具</text>
<text x="37" y="495" class="body">可信身份U001；参数与预算合规</text>
<text x="37" y="520" class="body">模型提出调用 ≠ 已执行调用</text>
<path class="line" d="M220 549 V576"/>
<rect x="20" y="579" width="400" height="134" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="592" width="4" height="108" rx="2" fill="#087e84"/>
<text x="37" y="607" class="label" style="fill:#087e84">④ ToolResult 回包</text>
<text x="37" y="634" class="body">call_id = c1，status = ok</text>
<text x="37" y="659" class="body">P17-v2#4：普通员工上限700元</text>
<text x="37" y="684" class="body">回包记录来自本次实际工具执行</text>
<path class="line" d="M220 713 V740"/>
<rect x="20" y="743" width="400" height="109" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="756" width="4" height="83" rx="2" fill="#2667ac"/>
<text x="37" y="771" class="label" style="fill:#2667ac">⑤ 第2轮输入 context</text>
<text x="37" y="798" class="body">保留调用 + c1回包 + 当前已知条件</text>
<text x="37" y="823" class="body">策略依据新观察继续决定</text>
<path class="line" d="M220 852 V879"/>
<rect x="20" y="882" width="400" height="109" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="895" width="4" height="83" rx="2" fill="#087e84"/>
<text x="37" y="910" class="label" style="fill:#087e84">⑥ 完成输出，独立核验</text>
<text x="37" y="937" class="body">answered；700元；P17-v2#4</text>
<text x="37" y="962" class="body">650 ≤ 700，本例金额未超限</text>
<rect x="20" y="1013" width="400" height="70" rx="8" fill="#e7f1f2"/>
<text x="33" y="1038" class="small">缺日期：第1轮先澄清，零工具调用。</text>
<text x="33" y="1062" class="small">旧证据：追加get_policy，再取有效版本。</text>
</svg>
