<svg xmlns="http://www.w3.org/2000/svg" id="G7" width="440" height="1160" viewBox="0 0 440 1160" role="img" aria-labelledby="G7-title G7-desc">
<title id="G7-title">G7 同一更正，两种推进方式</title>
<desc id="G7-desc">交错决策每次根据已知条件与新观察选择下一动作，显式计划保存待执行步骤及依赖。两种方式都可在用户纠正城市后重新规划。计划变量改了还不够，执行器必须取消依赖海岚的未执行调用并真正读取更新后的队列；已完成观察保留，累计预算不重置。</desc>
<defs><marker id="G7-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087e84"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#162c40}.small{font-size:15px;fill:#526879}.body{font-size:17px}.label{font-size:16px;font-weight:600}.title{font-size:25px;font-weight:700}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px}.line{fill:none;stroke:#087e84;stroke-width:2;marker-end:url(#G7-arrow)}.rule{stroke:#b5c5d0;stroke-width:1}</style>
<rect width="440" height="1160" rx="16" fill="#f6f8fb"/>
<rect x="20" y="22" width="44" height="28" rx="7" fill="#162c40"/><text x="42" y="42" text-anchor="middle" style="fill:white;font-size:16px;font-weight:700">G7</text>
<text x="20" y="85" class="title">同一更正，两种推进方式</text>
<text x="20" y="113" class="small">共同条件：海岚更正为云洲，日期不变。</text>
<rect x="20" y="137" width="400" height="184" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="150" width="4" height="158" rx="2" fill="#2667ac"/>
<text x="37" y="165" class="label" style="fill:#2667ac">A 交错决策：逐轮决定</text>
<text x="37" y="192" class="body">1. 查海岚制度，得到观察</text>
<text x="37" y="217" class="body">2. 用户更正：改去云洲</text>
<text x="37" y="242" class="body">3. 更新状态，下一轮查云洲</text>
<text x="37" y="267" class="body">4. 查到云洲标准后比较金额</text>
<path class="line" d="M220 321 V348"/>
<rect x="20" y="351" width="400" height="109" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="364" width="4" height="83" rx="2" fill="#2667ac"/>
<text x="37" y="379" class="label" style="fill:#2667ac">每轮都看新观察与当前条件</text>
<text x="37" y="406" class="body">不用单独Planner也能修正下一步</text>
<text x="37" y="431" class="body">仍需停止条件与累计预算</text>
<text x="20" y="499" class="label" style="fill:#087e84">B 显式计划：保存待办及依赖</text>
<rect x="20" y="521" width="400" height="134" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="534" width="4" height="108" rx="2" fill="#087e84"/>
<text x="37" y="549" class="label" style="fill:#087e84">更正前 pending_calls</text>
<text x="37" y="576" class="body">已完成：查海岚（保留历史）</text>
<text x="37" y="601" class="body">未执行：比较海岚金额</text>
<text x="37" y="626" class="body">未执行：组织海岚引用回答</text>
<path class="line" d="M220 655 V682"/>
<rect x="20" y="685" width="400" height="134" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="698" width="4" height="108" rx="2" fill="#a35d18"/>
<text x="37" y="713" class="label" style="fill:#a35d18">更正事件 state_updated</text>
<text x="37" y="740" class="body">known.city改云洲，revision递增</text>
<text x="37" y="765" class="body">取消依赖旧城市的未执行项</text>
<text x="37" y="790" class="body">旧证据退出有效集合，历史保留</text>
<path class="line" d="M220 819 V846"/>
<rect x="20" y="849" width="400" height="109" rx="10" fill="white" stroke="#b5c5d0"/><rect x="20" y="862" width="4" height="83" rx="2" fill="#087e84"/>
<text x="37" y="877" class="label" style="fill:#087e84">更正后：执行新队列</text>
<text x="37" y="904" class="body">查云洲 → 核对金额 → 再决定</text>
<text x="37" y="929" class="body">执行器确实读取新的pending_calls</text>
<rect x="20" y="980" width="400" height="118" rx="8" fill="#e7f1f2"/>
<text x="33" y="1005" class="small">不能仅在for循环中重绑定计划变量。</text>
<text x="33" y="1029" class="small">原迭代器可能仍执行旧列表的下一项。</text>
<text x="33" y="1053" class="small">两种方式都可重规划；没有固定能力排名。</text>
<text x="33" y="1077" class="small">已用decisions / tools预算仍累计。</text>
</svg>
