name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python scripts/check_repo.py
      - run: python scripts/check_diagrams.py --suite all
      - run: python -m unittest discover -s tests -v
      - run: python examples/agent_lab/lab.py --scenario all
      - run: python examples/foundations/math_lab.py --section all
      - run: python examples/advanced/runtime_lab.py --scenario all
      - run: python -m examples.policy_agent eval --suite all --mode offline --output .local/policy_agent/ci-report.json
      - name: Check application labs
        run: |
          python -m examples.model_protocol_lab.lab --scenario all --output .local/model_protocol
          python -m examples.service_lab.lab --scenario all --output .local/service_lab/checks
          python -m examples.knowledge_pipeline_lab --scenario all --output .local/knowledge_pipeline_lab
          python -m examples.sql_agent_lab --scenario all --output .local/sql_agent_lab
          python examples/event_agent_lab/lab.py --scenario all --output .local/event_agent_lab/all-report.json
          python examples/multimodal_lab/lab.py --scenario all --output .local/multimodal_lab/all-report.json
