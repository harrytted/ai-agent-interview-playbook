name: Documentation site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Check repository content
        run: python scripts/check_repo.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check diagrams and offline policy tasks
        run: |
          python scripts/check_diagrams.py --suite all
          python -m examples.policy_agent eval --suite all --mode offline --output .local/policy_agent/ci-report.json

      - name: Prepare website sources
        env:
          SITE_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: python scripts/prepare_site.py --source-ref "$SITE_SOURCE_REF"

      - name: Check application labs
        run: |
          python -m examples.model_protocol_lab.lab --scenario all --output .local/model_protocol
          python -m examples.service_lab.lab --scenario all --output .local/service_lab/checks
          python -m examples.knowledge_pipeline_lab --scenario all --output .local/knowledge_pipeline_lab
          python -m examples.sql_agent_lab --scenario all --output .local/sql_agent_lab
          python examples/event_agent_lab/lab.py --scenario all --output .local/event_agent_lab/all-report.json
          python examples/multimodal_lab/lab.py --scenario all --output .local/multimodal_lab/all-report.json

      - name: Build website
        run: python -m mkdocs build --strict

      - name: Check built HTML
        run: python scripts/check_site.py

      - name: Upload Pages artifact
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
